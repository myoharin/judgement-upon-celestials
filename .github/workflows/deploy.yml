name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch uses that name

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm' # Speeds up future builds

      - name: Install dependencies
        run: npm ci # Uses package-lock.json for clean, predictable installs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite builds into the 'dist' directory by default

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4